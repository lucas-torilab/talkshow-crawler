[project]
name = "talkshow-crawler"
version = "0.1.0"
description = "CLI to download and save YouTube video transcripts."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.15.0",
    "requests>=2.34.2",
    "typer>=0.27.1",
    "youtube-transcript-api>=1.2.4",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
talkshow-crawler = "talkshow_crawler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talkshow_crawler"]
